services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: insightloop
      POSTGRES_PASSWORD: insightloop
      POSTGRES_DB: insightloop
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightloop -d insightloop"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
